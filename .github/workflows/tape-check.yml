name: tape-check

on:
  schedule:
    - cron: "40 12 * * *"
    - cron: "40 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tape freshness
        run: python3 scripts/check-tape-freshness.py
