<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    @font-face {
      font-family: "Big Shoulders Display";
      font-style: normal;
      font-weight: 100 900;
      font-display: swap;
      src: url("../fonts/big-shoulders-display.woff2") format("woff2");
    }
  </style>
  <style>
    html, body { margin: 0; width: 512px; height: 512px; overflow: hidden; }
    .tile {
      width: 512px;
      height: 512px;
      background: #251b15;
      position: relative;
    }
    .bar {
      position: absolute;
      left: 0;
      right: 0;
      height: 29px;
      background: #c97646;
    }
    .bar.top { top: 0; }
    .bar.bottom { bottom: 0; height: 28px; }
    .mark {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Big Shoulders Display", sans-serif;
      font-weight: 700;
      font-size: 256px;
      letter-spacing: 0.045em;
      line-height: 0.8;
      color: #f2f2f0;
    }
    .mark span { color: #c97646; }
  </style>
</head>
<body>
  <div class="tile">
    <div class="bar top"></div>
    <div class="mark">S<span>A</span></div>
    <div class="bar bottom"></div>
  </div>
</body>
</html>
